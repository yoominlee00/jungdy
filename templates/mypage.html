<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JungDy | MyPage</title>

    <!-- 구글폰트 -->
    <link href="https://fonts.googleapis.com/css?family=Stylish&display=swap" rel="stylesheet">
    <!-- tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css" rel="stylesheet">
    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" crossorigin="anonymous"></script>

    <style>
        * {
            font-family: 'Roboto', sans-serif;
        }

        main {
            padding-top: 110px;
        }

        /* Navigation */
        .nav-bar {
            position: fixed;
            top: 0;
            width: 100%;
        }


        .title {
            margin-bottom: 40px;
            text-align: center;
        }

        .nav__list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: space-between;
            /* Change to space-between */
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            z-index: 999;
        }

        .nav__list-item {
            flex: 1;
            /* 각 항목이 가용 공간을 균등하게 차지하도록 설정 */
            display: flex;
            justify-content: center;
            /* 가로 방향 중앙 정렬 */
            align-items: center;
            /* 세로 방향 중앙 정렬 */
            position: relative;
            text-align: center;
            /* 텍스트 중앙 정렬 */
        }

        .nav__list-item:not(:last-child)::after {
            content: "|";
            color: #ffffff;
            margin-left: 10px;
        }

        .nav__list-item a {
            display: block;
            color: #ffffff;
            text-align: center;
            padding: 20px 15px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s, color 0.3s;
            border-bottom: 2px solid transparent;
        }


        .nav__list-item a:hover {
            background-color: #2980b9;
            /* Lighter blue on hover */
            color: #ffffff;
            border-bottom: 2px solid #f39c12;
            /* Orange underline effect */
        }

        .nav__list-item a.active {
            background-color: #04AA6D;
        }

        .nav__list-item a.visited {
            background-color: #def605;
        }

        /* /////////////////////////////////////////////////////////////////////////////// */

        /* 스터디 카드 디자인: 검은색 박스, 흰색 텍스트 */
        .study-card {
            background-color: #000;
            color: #fff;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(255, 255, 255, 0.1);
            width: 40%;
            margin: 10px;
            margin-top: 20px;
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        /* 카드 기본정보 영역 */
        .study-basic {
            padding: 20px;
        }

        /* 스터디명은 강조 색상 적용 */
        .study-title {
            font-size: 22px;
            font-weight: bold;
            color: #ffcc00;
            /* 강조 색상 (노란빛) */
            margin-bottom: 10px;
        }

        /* 기본 정보 라벨(예: 인원수, 시간)은 약간 다른 색상과 굵게 */
        .info-label {
            font-weight: bold;
            color: #f578d8;
            /* 약간의 핑크 계열 */
        }

        /* 숨겨진 추가 정보 영역 (호버 시 표시) */
        .additional-info {
            padding: 20px;
            background-color: #1a1a1a;
            display: none;
            border-top: 1px solid #333;
        }

        /* 카드 호버 시 효과 */
        .study-card:hover {
            transform: scale(1.03);
        }

        /* 마우스 올렸을 때 추가 정보 표시 */
        .study-card:hover .additional-info {
            display: block;
        }

        .button-area {
            display: flex;
            flex-direction: row;
            /* 행 방향으로 아이템을 배열 */
            justify-content: flex-end;
            /* 아이템을 컨테이너의 시작점에서 정렬 */
            align-items: center;
            /* 세로 중앙 정렬 */
            padding: 10px;
        }

        .delete-button,
        .update-button {
            margin: 10px;
        }

        /* //////////////////////////////수정모달///////////////////////////////////////////////// */
        .modal {
            display: none;
            position: fixed;
            /* position: center는 유효하지 않으므로 fixed 사용 */
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            /* 상단 여백을 줄여 새스터디창을 윗쪽으로 이동 */
            padding: 30px;
            border: 2px solid #888;
            width: 25%;
        }


        .form-con {
            display: block;
            width: 100%;
            padding: 0.575rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #495057;
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            margin-bottom: 0.7rem;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>

    <script>
        $(document).ready(function () {

            //////////////////모달////////////////////////////////////////////////
            var modal = document.getElementById('updateStudyModal');
            var btn = document.getElementById('update-button');
            var span = document.getElementsByClassName("close")[0];
            btn.onclick = function () {
                modal.style.display = "block";
            }
            span.onclick = function () {
                modal.style.display = "none";
            }
            window.onclick = function (event) {
                if (event.target == modal) {
                    modal.style.display = "none";
                }
            }
        });
    </script>

</head>

<body>
    <header>
        <nav class="nav-bar bg-black text-white p-4 flex justify-between items-center">
            <ul class="nav__list">
                <li class="nav__list-item"><a href="#Mystudy">내가 만든 스터디</a></li>
                <li class="nav__list-item"><a href="#Joinstudy">참여중인 스터디</a></li>
                <li class="nav__list-item"><a href="#Calender">Calender</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="Mystudy">

            <div class="title">
                <h1 class="mb-4 text-3xl font-extrabold text-gray-900 dark:text-white md:text-5xl lg:text-6xl">내가만든
                    study
                </h1>
            </div>

            <!-- ///////////////////카드////////////////////////// -->
            <!-- <div class="flex flex-wrap justify-between">
                    <div class="study-card"> -->
            <!-- 기본 정보 영역 -->
            <!-- <div class="study-basic">
                <div class="study-title">스터디명: {{ study.study_name }}</div>
                <div class="text-sm mt-2">
                    <span class="info-label">인원수:</span> {{ study.current_participants }} / {{ study.max_participants }}
                </div>
                <div class="text-sm">
                    <span class="info-label">시간:</span> {{ study.start_time }} ~ {{ study.end_time }}
                </div>
            </div> -->
            <!-- 추가 정보 (호버시 드롭다운) -->
            <!-- <div class="additional-info">
                <div class="text-sm mt-2"><span class="info-label">장소:</span> {{ study.location }}</div>
                <div class="text-sm"><span class="info-label">스터디 내용:</span> {{ study.study_content }}</div>
            </div> -->
            <!-- 버튼 영역 -->
            <!-- <div class="mt-4 p-4">
                {% if study.participation_status == "참여중" %}
                <button class="participation-button btn-active">참여중</button>
                {% elif study.participation_status == "참여마감" %}
                <button class="participation-button btn-full">참여마감</button>
                {% else %}
                <form action="{{ url_for('study.join_study', study_id=study._id) }}" method="POST">
                    <button type="submit" class="participation-button btn-join">참여하기</button>
                </form>
                {% endif %}
            </div> -->


            <!-- 임시 더미 데이터 카드 -->
            <div class="flex flex-wrap justify-between">
                <div class="study-card">
                    <div class="study-card p-1 bg-white rounded shadow cursor-pointer">
                        <!-- 호버시 커서변경 -->

                        <div class="study-basic">
                            <div class="study-title text-lg font-bold">HTTP & REST API</div>
                            <div class="text-sm mt-2">
                                <span class="info-label">인원수:</span> 4/10
                            </div>
                            <div class="text-sm">
                                <span class="info-label">시간:</span> 15:00~17:00
                            </div>
                        </div>

                        <!-- 클릭 시 추가정보 -->
                        <div class="additional-info hidden">
                            <div class="text-sm mt-2"><span class="info-label"></span> 장소: 교육동 라운지</div>
                            <div class="text-sm"><span class="info-label">스터디 내용:</span> 맛있는 돈까스~</div>
                        </div>

                        <div class="button-area">
                            <button id="delete-button"
                                class="delete-button px-6 py-2.5 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors">Delete</button>
                            <button id="update-button"
                                class="update-button px-6 py-2.5 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">Update</button>
                        </div>
                    </div>
                </div>
                <!-- ////////////////////////////////////////////////////////////////////////////////////////////////////// -->
                <!-- 스터디 수정 모달 -->
                <div id="updateStudyModal" class="modal">
                    <div class="modal-content">
                        <span class="close">&times;</span>
                        <h1>스터디 수정하기</h1>
                        <br><br>
                        <form action="{{ url_for('study.update_study') }}" method="POST">
                            <label for="study_name" class="label">스터디명:</label>
                            <input type="text" id="study_name" name="study_name" class="form-con" required>
                            <br><br>
                            <label>카테고리:</label>
                            <div>
                                <input type="radio" id="frontend" name="category" value="frontend" checked>
                                <label for="frontend" style="margin-right: 20px;">Frontend</label>
                                <input type="radio" id="backend" name="category" value="backend">
                                <label for="backend">Backend</label>
                            </div>
                            <br><br><br>
                            <label for="study_date">날짜:</label>
                            <input type="date" id="study_date" name="study_date" required>
                            <br><br><br>
                            <label for="start_time">시작 시간:</label>
                            <input type="time" id="start_time" name="start_time" required>
                            <br><br><br>
                            <label for="end_time">종료 시간:</label>
                            <input type="time" id="end_time" name="end_time" required>
                            <br><br><br>
                            <label for="location">장소:</label>
                            <input type="text" id="location" name="location" class="form-con" required>
                            <br><br><br>
                            <label for="max_participants">최대 인원:</label>
                            <input type="number" id="max_participants" name="max_participants" class="form-con"
                                required>
                            <br><br>
                            <label for="study_content">스터디 내용:</label>
                            <textarea id="study_content" name="study_content" class="form-con" placeholder="내용을 입력하세요."
                                style="width: 100%; height: 80px; overflow-y: auto; overflow-x: hidden; resize: vertical;"
                                required></textarea>
                            <br><br>
                            <button type="submit"
                                class="mt-3 bg-gray-600 hover:bg-gray-700 text-white font-bold py-4 px-4 rounded w-full">수정완료</button>
                        </form>
                    </div>
                </div>



                <!-- ////////////////////////////////////////////////////////////////////////////                -->


            </div>


        </div>
        </div>


        <div id="Joinstudy">
            <div class="title">
                <h1 class="mb-4 text-3xl font-extrabold text-gray-900 dark:text-white md:text-5xl lg:text-6xl">Joining
                    study
                </h1>
            </div>
            <div class="flex flex-wrap justify-between">
                <div class="study-card">
                    <div class="study-card p-1 bg-white rounded shadow cursor-pointer"> <!-- 호버시 커서변경 -->

                        <div class="study-basic">
                            <div class="study-title text-lg font-bold">HTTP & REST API</div>
                            <div class="text-sm mt-2">
                                <span class="info-label">인원수:</span> 4/10
                            </div>
                            <div class="text-sm">
                                <span class="info-label">시간:</span> 15:00~17:00
                            </div>
                        </div>

                        <!-- 클릭 시 추가정보 -->
                        <div class="additional-info hidden">
                            <div class="text-sm mt-2"><span class="info-label"></span> 장소: 교육동 라운지</div>
                            <div class="text-sm"><span class="info-label">스터디 내용:</span> 맛있는 돈까스~</div>
                        </div>
                    </div>

                    <div class="button-area">
                        <button
                            class="Out-button px-6 py-2.5 border-2 border-green-500 text-green-500 rounded-lg hover:bg-green-50 transition-colors">나가기</button>

                    </div>
                </div>


            </div>

            <div id="Calender">
                <div class="title">
                    <h1 class="mb-4 text-3xl font-extrabold text-gray-900 dark:text-white md:text-5xl lg:text-6xl">
                        Calender
                    </h1>
                </div>
            </div>

    </main>
</body>

</html>
