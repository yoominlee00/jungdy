<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
    <title>JungDy | Login Page</title>

    <!-- 구글폰트 -->
    <link href="https://fonts.googleapis.com/css?family=Stylish&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css" rel="stylesheet">

    <style>
        * {
            font-family: 'Roboto', sans-serif;
        }

        .form-control {
            display: block;
            width: 100%;
            padding: 0.575rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #495057;
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            margin-bottom: 0.7rem;
        }

        .label {
            display: inline-block;
            margin-bottom: 0.7rem;
        }

        .container {
            padding: 40px;
            background-color: white;
            border-radius: 8px;
            width: 500px;
            margin: auto;
            margin-top: 60px;
        }

        .logo {
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }

        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">JUNGDY</div>

        <!-- Flash 메시지 표시 -->
        {% with messages = get_flashed_messages(with_categories=True) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- 로그인 폼 -->
        <form action="{{ url_for('user.login') }}" method="POST">
            <label for="user_id" class="label">ID</label>
            <input type="text" id="user_id" name="user_id" class="form-control" placeholder="아이디를 입력하세요" required>

            <label for="password" class="label">PW</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요" required>

            <button type="submit" class="mt-3 bg-black hover:bg-gray-900 text-white font-bold py-2 px-4 rounded w-full">
                Login
            </button>
        </form>

        <!-- 회원가입 페이지로 이동 -->
        <a href="{{ url_for('user.signup') }}" class="block mt-3">
            <button type="button" class="mt-3 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded w-full">
                Sign up
            </button>
        </a>
    </div>
</body>

</html>
