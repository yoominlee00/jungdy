<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JungDy | HomePage</title>

    <!-- 구글폰트 -->
    <link href="https://fonts.googleapis.com/css?family=Stylish&display=swap" rel="stylesheet">

    <!-- tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css" rel="stylesheet">

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" crossorigin="anonymous"></script>

    <style>
        * {
            font-family: 'Roboto', sans-serif;
        }

        .modal-content h1 {
            font-size: 2.25rem;
            /* 36px */
            font-weight: bold;
            color: #333;
            margin-bottom: 1rem;
        }


        .category-button {
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        #study-container {
            padding: 20px;
            width: 100%;
            margin: auto;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            overflow: auto;
            height: auto;

            
        }


        .category-button.selected {
            background-color: black;
            color: white;
        }

        .date-navigation a {
            padding: 10px 15px;
            margin: 0 10px;
        }

        .study-card {
            background-color: #333;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 40%;
            /* display: inline-block; */
            margin: 10px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            /* 카드 간 간격 */
        }

        .study-title {
            font-size: 20px;
            font-weight: bold;
        }

        .participation-button {
            border: none;
            /* 기본 테두리 제거 */
            padding: 10px 20px;
            border-radius: 5px;
            /* 버튼 둥근 모서리 */
            cursor: pointer;
            /* 마우스 포인터 */
            transition: background-color 0.3s;
            /* 배경색 변화 효과 */
        }

        .btn-join {
            background-color: red;
        }

        .btn-join:hover {
            background-color: darkred;
        }

        .btn-full {
            background-color: gray;
        }

        .btn-active {
            background-color: green;
        }

        /* 새로운 스터디 만들기 스타일 */
        .add-button {
            font-size: 30px;
            padding: 10px 20px;
            /* 버튼의 내부 여백 */
            background-color: #f578d8;
            /* 버튼의 배경색 */
            color: white;
            /* 버튼의 텍스트 색상 */
            border-radius: 50%;
            /* 원형 버튼으로 만들기 */
            cursor: pointer;
            /* 커서를 포인터로 변경 */
            position: fixed;
            /* 페이지에 고정 */
            bottom: 20px;
            /* 하단에서 20px */
            right: 20px;
            /* 우측에서 20px */
        }

        .add-button:hover {
            background-color: #45a049;
            /* 호버 시 배경색 변경 */
        }

        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            /* Stay in place */
            z-index: 1;
            /* Sit on top */
            left: 0;
            top: 0;
            width: 100%;
            /* Full width */
            height: 100%;
            /* Full height */
            overflow: auto;
            /* Enable scroll if needed */

            background-color: rgba(0, 0, 0, 0.4);
            /* Black w/ opacity */
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            /* 15% from the top and centered */
            padding: 30px;
            border: 2px solid #888;
            width: 80%;
            /* Could be more or less, depending on screen size */
        }

        .form-con {
            display: block;
            width: 100%;
            padding: 0.575rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #495057;
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            margin-bottom: 0.7rem;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        /* 프론트 백 호버시ㅏ 색변화 */
        .category-button:hover {
            background-color: #4CAF50;
            /* 호버 시 배경색 */
            color: white;
            /* 호버 시 텍스트 색상 */
        }

        .category-button.selected {
            background-color: rgb(255, 255, 255);
            color: rgb(24, 24, 24);
        }
    </style>

    <script>
        $(document).ready(function () {
            // 마이페이지 버튼에 마우스를 올리면 드롭다운 메뉴 표시
            $('#dropdownButton').mouseenter(function () {
                $('#dropdownMenu').removeClass('hidden');
            });

            // 마이페이지 버튼 및 드롭다운 메뉴에 마우스가 아닌 다른 곳을 클릭하면 드롭다운 메뉴 숨기기
            $(document).click(function (event) {
                if (!$(event.target).closest('#dropdownButton, #dropdownMenu').length) {
                    $('#dropdownMenu').addClass('hidden');
                }
            });

            // 드롭다운 메뉴에서 마우스가 벗어났을 때 메뉴 숨기기
            $('#dropdownMenu').mouseleave(function () {
                $(this).addClass('hidden');
            });

            // 로그아웃 버튼 클릭 시 Flask 라우트 호출
            $('#logoutButton').click(function () {
                window.location.href = "{{ url_for('user.logout') }}";  // 🔹 user.logout 실행
            });


            document.getElementById('datePicker').addEventListener('change', function () {
                const newDate = this.value;
                const url = "{{ url_for('study.home', category=category, date='__date__') }}".replace('__date__', newDate);
                window.location.href = url;
            });

            //만약 스터디카드가 많을시 무한스크롤 구현
            $(window).scroll(function () {
                if ($(window).scrollTop() + $(window).height() > $(document).height() - 100) {
                    loadMoreData();
                }
            });

            function loadMoreData() {
                // AJAX 요청을 사용하여 서버에서 추가 데이터를 가져옵니다.
                $.ajax({
                    url: '/some-route-to-load-more',  // 데이터를 불러올 서버의 경로
                    type: 'GET',
                    success: function (data) {
                        // 데이터 로드 성공 시, #study-container에 카드를 추가합니다.
                        $('#study-container').append(data);  // 서버가 HTML 조각을 반환한다고 가정
                    },
                    error: function () {
                        console.log('Error loading more studies');
                    }
                });
            }

            // 새로운 카드 만들기 

            // Get the modal
            var modal = document.getElementById('createStudyModal');

            // Get the button that opens the modal
            var btn = document.getElementById('myBtn'); // 추가할 + 버튼의 ID를 'myBtn'으로 가정합니다.

            // Get the <span> element that closes the modal
            var span = document.getElementsByClassName("close")[0];

            // When the user clicks the button, open the modal 
            btn.onclick = function () {
                modal.style.display = "block";
            }

            // When the user clicks on <span> (x), close the modal
            span.onclick = function () {
                modal.style.display = "none";
            }

            // When the user clicks anywhere outside of the modal, close it
            window.onclick = function (event) {
                if (event.target == modal) {
                    modal.style.display = "none";
                }
            }

            $('.study-card').on('click', function() {
                $(this).find('.additional-info').toggle('hidden');
            });

        });

    </script>

</head>

<body>
    <div>
        <div class="bg-black text-white p-4 flex justify-between items-center">

            <h1 class="text-lg font-bold">JungDy</h1>
            <div>
                <a href="{{ url_for('study.home', category='frontend', date=today) }}"
                    class="category-button {% if category == 'frontend' %}selected{% endif %}">Frontend</a>
                <a href="{{ url_for('study.home', category='backend', date=today) }}"
                    class="category-button {% if category == 'backend' %}selected{% endif %}">Backend</a>
            </div>

            <!-- 마이페이지 드롭다운 메뉴 -->
            <div class="relative">
                <button class="mx-2 px-4 py-2 rounded bg-gray-800 focus:outline-none" id="dropdownButton">
                    마이페이지
                </button>
                <div class="absolute hidden text-left bg-white shadow-md rounded mt-1" id="dropdownMenu">
                    <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">내스터디</a>
                    <a href="#" id="logoutButton" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer">로그아웃</a>
                </div>
            </div>
        </div>
    </div>


    <!-- 날짜 네비게이션 -->
    <div class="text-center mt-6 mb-4">
        <div class="date-navigation">
            <a href="{{ url_for('study.home', category=category, date=prev_date) }}">◀️</a>
            <!-- <span class="text-xl font-semibold mx-4">{{ today }}</span> -->
            <input type="date" id="datePicker" class="text-xl font-semibold mx-4" value="{{ today }}">
            <a href="{{ url_for('study.home', category=category, date=next_date) }}"> ▶️</a>
        </div>
    </div>



    <!-- 스터디 목록 -->
    <div id="study-container" class="bg-gray-300">
        <!-- <h2 class="text-2xl font-semibold mb-4">스터디 목록</h2> -->

        <div class="flex flex-wrap justify-between">
            <!-- 임시 더미 데이터 카드 -->
            <div class="study-card p-4 bg-white rounded shadow cursor-pointer">
                <div class="study-title text-lg font-bold">HTTP & REST API</div>
                <div class="text-sm mt-2">
                    참여 인원: 4/10
                </div>
                <div class="text-sm">
                    시간: 15:00 ~ 17:00
                </div>
                <div class="additional-info hidden">
                    <div class="text-sm mt-2">
                        장소: 교육동 라운지
                    </div>
                    <div class="text-sm">
                        세부 공부 내용: HTTP 기본 개념, 메서드 종류 정리, RESTful API 설계 원칙
                    </div>
                </div>
                <div class="mt-4">
                    <button class="participation-button bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">참여하기</button>
                </div>
            </div>
        </div>
            

            <!-- 추가 더미 데이터 카드 -->
            <div class="study-card">
                <div class="study-title">데이터 사이언스 공부방</div>
                <div class="text-sm">
                    10:00 ~ 12:00
                </div>
                <div class="text-sm mt-2">
                    참여 인원: 5/15
                </div>
                <div class="mt-4">
                    <button class="participation-button btn-full">참여마감</button>
                </div>
            </div>


            <!-- ------------------------------------------------------------------------------- -->
        </div>

        <!-- 새로운 카드생성 -->

        <button id="myBtn" class="add-button">+</button>

        <!-- 모달 배경 -->
        <div id="createStudyModal" class="modal">
            <!-- 모달 내용 -->
            <div class="modal-content">
                <span class="close">&times;</span>
                <h1>스터디 만들기</h1>
                <br><br>
                <form action="{{ url_for('study.create_study') }}" method="POST">
                    <label for="study_name" class="label">스터디명:</label>
                    <input type="text" id="study_name" name="study_name" class="form-con" required>
                    <br><br>

                    <label>카테고리:</label>
                    <div>
                        <input type="radio" id="frontend" name="category" value="frontend" checked>
                        <label for="frontend" style="margin-right: 20px;">Frontend</label>

                        <input type="radio" id="backend" name="category" value="backend">
                        <label for="backend">Backend</label>
                    </div>

                    <br><br><br>

                    <label for="study_date">날짜:</label>
                    <input type="date" id="study_date" name="study_date" required>
                    <br><br><br>

                    <label for="start_time">시작 시간:</label>
                    <input type="time" id="start_time" name="start_time" required>
                    <br><br><br>

                    <label for="end_time">종료 시간:</label>
                    <input type="time" id="end_time" name="end_time" required>
                    <br><br><br>

                    <label for="location">장소:</label>
                    <input type="text" id="location" name="location" class="form-con" required>
                    <br><br><br>

                    <label for="max_participants">최대 인원:</label>
                    <input type="number" id="max_participants" name="max_participants" class="form-con" required>
                    <br><br>

                    <label for="study_content">스터디 내용:</label>
                    <textarea id="study_content" name="study_content" class="form-con" placeholder="내용을 입력하세요."
                        style="width: 100%; height: 80px; overflow-y: auto; overflow-x: hidden; resize: vertical;"
                        required>
                    </textarea>
                    <br><br>

                    <button type="submit"
                        class="mt-3 bg-gray-600 hover:bg-gray-700 text-white font-bold py-4 px-4 rounded w-full">스터디생성</button>

                </form>
            </div>
        </div>

    </div>
